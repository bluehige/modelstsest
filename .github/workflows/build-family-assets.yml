name: Build family character assets
on:
  push:
    paths:
      - 'assets/vietnam_family/BUILD_REQUEST.txt'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: family-assets
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image decoder
        run: python -m pip install Pillow==11.3.0
      - name: Preserve existing city tests
        run: python -m unittest discover -s tests -v
      - name: Build and validate character assets
        run: |
          python assets/vietnam_family/source/build_family.py
          python assets/vietnam_family/source/validate_family.py
      - name: Publish generated assets to this repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/vietnam_family/models assets/vietnam_family/textures assets/vietnam_family/validation
          if ! git diff --cached --quiet; then
            git commit -m 'Build reference-matched family GLB character assets [skip ci]'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
